services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://foundry:foundry@postgres:5432/foundry
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: ollama
      AI_BASE_URL: http://ollama:11434/v1
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    volumes:
      - foundry_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  ollama:
    image: ollama/ollama:latest
    profiles:
      - local-ai
    volumes:
      - ollama:/root/.ollama

volumes:
  foundry_postgres:
  ollama:
